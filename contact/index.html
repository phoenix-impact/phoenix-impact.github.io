         <main id="main-content" tabindex="-1">
            <div class="container pb-6 pt-6 pt-md-10 pb-md-10">
  <div class="content">
    <form action="https://formspree.io/f/xqabzyyo" method="POST" class="contact-form">
      <h2>We'd love to hear from you!</h2>

      <div class="form-group">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" id="name" name="name" required autocomplete="name">
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="message" class="form-label">Message</label>
        <textarea class="form-control" id="message" name="message" required></textarea>
      </div>

      <button type="submit" class="button contact-submit">Send Message</button>
    </form>
  </div>
